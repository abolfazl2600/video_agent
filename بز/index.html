<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=720,height=1280"><script src="gsap.min.js"></script><style>
@font-face{font-family:BYekan;src:url(BYekan.ttf)}*{box-sizing:border-box}html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#eaf2f3}#root{position:relative;width:720px;height:1280px;overflow:hidden;background:#eaf2f3}#scene{position:absolute;inset:0;width:720px;height:1280px;transform-origin:50% 55%}.scene-content{position:absolute;inset:0;width:100%;height:100%;padding:64px 53px;display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}p{margin:0;text-align:center;font-family:BYekan;color:#1e4052;white-space:nowrap;width:100%;font-weight:700;-webkit-text-stroke:1px currentColor}#first{font-size:52px;height:76px;line-height:1.2}#space{font-size:88px;height:114px;line-height:1.1;color:#194252;text-shadow:4px 5px #a6d5d2;-webkit-text-stroke:2px currentColor}#case{position:relative;isolation:isolate;z-index:0;font-size:106px;line-height:1.2;height:134px;color:#113a48;-webkit-text-stroke:2px currentColor}#case::before{content:'';position:absolute;inset:0 26px;background:#2bbca9;transform:skew(-7deg,-2deg);z-index:0}.caseword{position:relative;z-index:1}#stroke{height:4px;width:478px;background:#165761;transform:rotate(-2deg);margin-top:10px}#last{font-size:54px;margin-top:36px;line-height:1.3}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="720" data-height="1280"><div id="scene" data-layout-ignore></div><div class="scene-content"><p id="first">وقتی می تونی از</p><p id="space">فضای خالی</p><p id="case"><span class="caseword">چمدونت</span></p><span id="stroke"></span><p id="last">درآمد داشته باشی</p></div></div><script src="film.js"></script></body></html>
