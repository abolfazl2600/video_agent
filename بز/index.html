<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=720,height=1280"><script src="gsap.min.js"></script><style>
@font-face{font-family:BYekan;src:url(BYekan.ttf)}
*{box-sizing:border-box}html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#050B16}
#root{width:720px;height:1280px;position:relative;overflow:hidden;color:#e8fcff;background:radial-gradient(ellipse at 56% 36%,#0d2844,#050b16 68%)}
#scene{position:absolute;inset:0;z-index:1}
#reference{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;filter:contrast(1.08)}
#vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to bottom,rgba(3,7,16,.12),transparent 35%,rgba(3,7,16,.53))}
#scanlines{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.19;background:repeating-linear-gradient(0deg,transparent 0px,transparent 7px,rgba(43,216,236,.16) 8px,transparent 9px)}
#hud{position:absolute;inset:42px 34px;z-index:5;border:1px solid rgba(47,222,241,.23);pointer-events:none}
#hud:before,#hud:after{position:absolute;content:"";width:106px;height:3px;background:#29e8f1;box-shadow:0 0 16px #29e8f1}
#hud:before{top:-2px;right:0}#hud:after{bottom:-2px;left:0}
.label{position:absolute;z-index:6;font:15px/1.4 ui-monospace,monospace;letter-spacing:2px;color:#5debf2;direction:ltr;text-shadow:0 0 14px rgba(21,203,220,.65)}
#top-left{left:59px;top:68px}#top-right{right:58px;top:68px;text-align:right}#bottom{left:56px;bottom:73px}
.copy{position:absolute;z-index:7;top:114px;left:45px;right:45px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.copy p{margin:0;font-family:BYekan,sans-serif;text-align:center;direction:rtl;font-weight:700;line-height:1.3;text-shadow:0 3px 20px rgba(2,13,29,.8);white-space:nowrap}
#first{font-size:52px;color:#d8faff}
#space{font-size:96px;color:#2eeaf0;text-shadow:0 0 18px rgba(0,235,236,.7)}
#case{font-size:110px;color:#f5fdff;background:linear-gradient(90deg,transparent,#12354e 17%,#0d304b 83%,transparent);padding:0 30px;border-top:1px solid #4ae7f0;border-bottom:1px solid #4ae7f0}
#last{margin-top:26px;font-size:59px;color:#defbff}
#cta{position:absolute;bottom:172px;left:80px;right:80px;z-index:7;font:700 41px/1.3 BYekan;text-align:center;color:#c8faff;text-shadow:0 0 25px #07a6bb}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="720" data-height="1280">
<div id="scene" data-layout-ignore></div><img id="reference" src="reference.jpg" alt="Original opening reference"/>
<div id="vignette"></div><div id="scanlines"></div><div id="hud"></div>
<div id="top-left" class="label">ADVERTIO / FLIGHT SYSTEM</div><div id="top-right" class="label">REC ●</div><div id="bottom" class="label">9:16 · DARK TECH · 00:15</div>
<div class="copy"><p id="first">وقتی می‌تونی از</p><p id="space">فضای خالی</p><p id="case">چمدونت</p><p id="last">درآمد کسب کنی</p></div><div id="cta">advertio.net</div>
</div><script src="film.js"></script></body></html>
