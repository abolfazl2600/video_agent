name: Advertio Artisans — Final Render
on:
  push:
    branches:
      - feature/advertio-artisans-reel-assets
    paths:
      - 'videos/advertio-artisans-reel/assets/slide-*.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: advertio-artisans-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final:
    if: github.ref == 'refs/heads/feature/advertio-artisans-reel-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: videos/advertio-artisans-reel
    steps:
      - uses: actions/checkout@v4
      - name: Check all six original slides
        id: assets
        shell: bash
        run: |
          ready=true
          for i in 01 02 03 04 05 06; do
            if [ ! -s "assets/slide-$i.png" ]; then
              echo "Missing assets/slide-$i.png"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Install FFmpeg
        if: steps.assets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Final render
        if: steps.assets.outputs.ready == 'true'
        run: python3 render.py
      - name: Validate final file
        if: steps.assets.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, subprocess
          f='renders/final.mp4'
          x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',f],text=True))
          v=next(s for s in x['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1080,1920,'30/1'),v
          assert abs(float(x['format']['duration'])-47)<0.2
          assert not any(s['codec_type']=='audio' for s in x['streams'])
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',f,'-f','null','-'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.assets.outputs.ready == 'true'
        with:
          name: advertio-artisans-final
          path: videos/advertio-artisans-reel/renders/final.mp4
          if-no-files-found: error
      - name: Publish verified MP4 to this branch
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renders/final.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish final Advertio artisans reel"
            git push origin HEAD:feature/advertio-artisans-reel-assets
          fi
