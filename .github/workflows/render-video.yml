name: Advertio Auto Render - Changed Folders

# On push: Quick Preview for the existing parcel project; Preview for others.
# For manually selected folder and quality use render-manual.yml.
run-name: Auto Render | ${{ github.ref_name }}

on:
  push:
    paths:
      - 'videos/**'
      - '!videos/advertio-cargo-tech-launch/**'
      - '.github/workflows/render-video.yml'

permissions:
  contents: read

jobs:
  select-projects:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.select.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select only the requested or changed video folders
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re, subprocess, sys
          root = pathlib.Path("videos")
          before, after = os.environ.get("BEFORE_SHA", ""), os.environ["AFTER_SHA"]
          if not before or set(before) == {"0"}:
              args = ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", after]
          else:
              args = ["git", "diff", "--name-only", before, after, "--", "videos/"]
          changed = subprocess.check_output(args, text=True).splitlines()
          folders = sorted({p.split("/")[1] for p in changed
                            if p.startswith("videos/") and len(p.split("/")) >= 3})
          validated = []
          for name in folders:
              if name == "advertio-cargo-tech-launch":
                  continue  # Remotion cargo uses its own isolated workflow
              if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", name):
                  sys.exit("Invalid video folder: " + name)
              project = root / name
              if not (project / "package.json").is_file():
                  continue  # removed folder
              validated.append(name)
          print("folders=" + json.dumps(validated, separators=(",", ":")))
          print("Selected video folders:", ", ".join(validated) if validated else "(none)", file=sys.stderr)
          PY

  render:
    needs: select-projects
    if: ${{ needs.select-projects.outputs.folders != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ADVERTIO_RENDER_MODE: ${{ (matrix.folder == 'parcel-to-iran-isometric' || matrix.folder == 'mother-supplement-network') && 'quick-preview' || 'preview' }}
      VIDEO_FOLDER: ${{ matrix.folder }}
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.select-projects.outputs.folders) }}
    concurrency:
      group: advertio-render-${{ matrix.folder }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: videos/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (required for video encoding)
        if: env.ADVERTIO_RENDER_MODE != 'quick-preview'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Verify Chrome for accelerated WebGL
        if: matrix.folder == 'parcel-to-iran-isometric'
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          (google-chrome --version || chromium --version || true)
      - name: Install project dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install Pillow==11.3.0
      - name: Validate shared Persian font assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import ImageFont, features
          root = Path.cwd().parents[1]
          assert features.check('raqm'), 'Pillow libraqm is required for correct Persian shaping'
          for filename in ('Vazirmatn-Regular.ttf', 'Vazirmatn-Bold.ttf'):
              f = root / 'assets' / 'fonts' / filename
              assert f.is_file(), f'Missing shared font: {f}'
              font = ImageFont.truetype(str(f), 36)
              print(f'Loaded shared Persian font: {f.name} ({f.stat().st_size} bytes)')
          PY
      - name: Validate only the selected video
        run: npm run lint
      - name: Render selected mode for this folder
        shell: bash
        run: |
          if [ "$ADVERTIO_RENDER_MODE" = "quick-preview" ]; then
            if [ "$VIDEO_FOLDER" != "parcel-to-iran-isometric" ] && [ "$VIDEO_FOLDER" != "mother-supplement-network" ]; then
              echo "::error::Quick Preview is not yet supported for folder: $VIDEO_FOLDER"
              exit 1
            fi
            ADVERTIO_RENDER_MODE=preview npm run samples
          else
            npm run render
          fi
      - name: Verify Quick Preview image set
        if: env.ADVERTIO_RENDER_MODE == 'quick-preview'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          frames=sorted(Path('.').glob('frame-sample-*.jpg'))
          assert len(frames)==10, f'Expected 10 images, got {len(frames)}'
          for path in frames:
              with Image.open(path) as im:
                  assert im.size==(720,1280), (path,im.size)
          sheet=Path('quick-preview-contact-sheet.jpg')
          assert sheet.is_file() and sheet.stat().st_size>1000, 'Missing contact sheet'
          with Image.open(sheet) as im:
              im.verify()
          print('Quick Preview: 10 verified frames and one contact sheet')
          PY
      - name: Verify Preview or Final MP4
        if: env.ADVERTIO_RENDER_MODE != 'quick-preview'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          mode=os.environ['ADVERTIO_RENDER_MODE']
          name='preview.mp4' if mode=='preview' else 'output.mp4'
          path=pathlib.Path(name)
          assert path.is_file() and path.stat().st_size>1000, f'Missing output: {path}'
          raw=subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=width,height,avg_frame_rate:format=duration','-of','json',name],text=True)
          obj=json.loads(raw)
          stream=obj['streams'][0]
          w,h=int(stream['width']),int(stream['height'])
          num,den=map(int,stream['avg_frame_rate'].split('/'))
          fps=num/den
          duration=float(obj['format']['duration'])
          assert w>0 and h>0 and fps>0 and duration>0, (w,h,fps,duration)
          if os.environ['VIDEO_FOLDER'] in ('parcel-to-iran-isometric','mother-supplement-network'):
              expected=(540,960,10) if mode=='preview' else (1080,1920,30)
              assert (w,h)==expected[:2] and abs(fps-expected[2])<0.01, (mode,w,h,fps)
              assert 14.9<=duration<=15.1, (mode,duration)
          print(f'{mode}: {name}, {w}x{h}, {fps}fps, {duration:.2f}s')
          PY
      - name: Upload Quick Preview images
        if: env.ADVERTIO_RENDER_MODE == 'quick-preview'
        uses: actions/upload-artifact@v4
        with:
          name: advertio-${{ matrix.folder }}-quick-preview-${{ github.run_number }}
          path: |
            videos/${{ matrix.folder }}/frame-sample-*.jpg
            videos/${{ matrix.folder }}/quick-preview-contact-sheet.jpg
          retention-days: 30
          if-no-files-found: error
      - name: Upload only the selected mode's MP4
        if: env.ADVERTIO_RENDER_MODE != 'quick-preview'
        uses: actions/upload-artifact@v4
        with:
          name: advertio-${{ matrix.folder }}-${{ env.ADVERTIO_RENDER_MODE }}-${{ github.run_number }}
          path: videos/${{ matrix.folder }}/${{ env.ADVERTIO_RENDER_MODE == 'preview' && 'preview.mp4' || 'output.mp4' }}
          retention-days: 30
          if-no-files-found: error
