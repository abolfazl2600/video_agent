name: Cleanup verified merged branches - 2026-11-24
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-20261124.yml'
permissions:
  contents: write
concurrency:
  group: cleanup-merged-branches-20261124
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and remove only reviewed merged refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          while read -r branch expected; do
            ref="refs/heads/$branch"
            remote="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [ -z "$remote" ]; then
              echo "Already absent: $branch"
              continue
            fi
            if [ "$remote" != "$expected" ]; then
              echo "::warning::Changed branch, retaining $branch"
              continue
            fi
            if ! git merge-base --is-ancestor "$expected" origin/main; then
              echo "::warning::Not fully merged, retaining $branch"
              continue
            fi
            git push --force-with-lease="$ref:$expected" origin ":$ref"
            test -z "$(git ls-remote --heads origin "$ref")"
            echo "Deleted verified merged branch: $branch"
          done <<'REVIEWED_REFS'
          feature/advertio-artisans-reel 7b61ffe8b30603514d3fe1bdf11e0d5ba3a23fd9
          feature/advertio-artisans-reel-assets 8154627b8661e0f8218c918a640a727ceab5d635
