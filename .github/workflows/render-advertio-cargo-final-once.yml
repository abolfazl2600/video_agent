name: Advertio Cargo - One-Time Full HD Final
run-name: Cargo Final | ${{ github.ref_name }}

on:
  push:
    paths:
      - '.github/workflows/render-advertio-cargo-final-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-final:
    if: github.ref_name == 'feature/advertio-cargo-remotion-launch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: videos/advertio-cargo-tech-launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and FFmpeg
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Lint and render Final 600 frames
        run: |
          npm run lint
          npm run render:final
          ffmpeg -hide_banner -loglevel error -y -ss 10 -i out/final.mp4 -frames:v 1 out/final-poster.jpg
      - name: Validate Full HD 20-second Final MP4
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          from fractions import Fraction
          p=pathlib.Path('out/final.mp4')
          assert p.exists() and p.stat().st_size>10000,p
          result=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          v=next(s for s in result['streams'] if s['codec_type']=='video')
          fps=float(Fraction(v['avg_frame_rate']))
          duration=float(result['format']['duration'])
          assert (v['width'],v['height'])==(1920,1080),(v['width'],v['height'])
          assert abs(fps-30)<.01,fps
          assert 19.8<=duration<=20.2,duration
          print('FINAL VERIFIED:',p,'1920x1080, 30fps,',duration,'seconds')
          PY
      - name: Upload Full HD Final Video
        uses: actions/upload-artifact@v4
        with:
          name: advertio-cargo-remotion-final-fullhd-${{ github.run_number }}
          path: |
            videos/advertio-cargo-tech-launch/out/final.mp4
            videos/advertio-cargo-tech-launch/out/final-poster.jpg
          retention-days: 30
          if-no-files-found: error
